services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_PATH: /data/course.sqlite
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@byte.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - course-data:/data
      - course-uploads:/app/uploads
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  course-data:
  course-uploads:
